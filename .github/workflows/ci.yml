name: 构建与回归测试

# 客户端可以忘了跑测试，这里在服务端把四层都兜住：
#   C++ 单测 / CLI 端到端冒烟 / WASM 产物一致性 / 源码与产物的同步。
# 尤其 wasm_smoke 第 34 组会比对 docs/wasm 页脚版本与 version.hpp：
# 升过版本号却忘了重编 wasm，CI 会直接红（v1.35~v1.37 曾连续三版漏重编）。
# check_wasm_sync.py 再补一层纯 git 检查：改了 src/ 却连版本号都没升、也没
# 重编时，页脚仍「一致」，只有它能拦住这类静默滞后。
# 本机没有 Linux 编译器时，至少可以在本地跑对应命令自查，见 BUILD.md。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp:
    name: C++ 单测 + CLI 冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: CMake 配置与编译
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2

      - name: 单元测试（869 项）
        working-directory: build
        run: ctest --output-on-failure

      - name: 素材生成器可复现
        # 全量重生成 88 份 .mid 后不得有字节差异，也不得多出未跟踪素材。
        # 只比二进制素材：.lrc 是文本，交给 git 的行尾归一化处理。
        run: |
          python3 tests/fixtures/make_fixture.py > /dev/null
          git diff --exit-code -- 'tests/fixtures/*.mid'
          test -z "$(git status --porcelain --untracked-files=all -- tests/fixtures/)"

      - name: CI 失败报告自测（28 项）
        # 冒烟失败时把每条断言写成 ::error 注解 + step summary；
        # 没有 job 日志下载权限也能从 check-run annotations 直接读到失败项。
        # 这条通道自己先自测，避免「诊断工具坏了却没人知道」。
        run: python3 tests/smoke.py --self-test

      - name: MusicXML 时值一致性（18 项自测 + 88 份素材）
        # 逐个 <note> 核对 <duration> 与 <type>/<dot/>；休止符间隙必须拆成
        # 标准时值之和，<rest measure="yes"/> 全小节休止按惯例豁免。
        run: |
          python3 tests/check_xml_durations.py --self-test
          python3 tests/check_xml_durations.py

      - name: MusicXML 连梁结构（18 项自测 + 88 份素材）
        # <beam> 必须按 begin/continue/end 闭合、只出现在短于四分的音符上、
        # 子元素顺序为 type/dot/time-modification -> staff -> beam -> notations。
        # 顺序错或悬挂的梁会让 MuseScore 丢掉整条音符，比不写梁更糟。
        run: |
          python3 tests/check_xml_beams.py --self-test
          python3 tests/check_xml_beams.py

      - name: 文本谱拍数守恒（26 项自测 + 88 份素材）
        # 一小节印出来的拍数必须等于拍号；休止符按最近档吸附会让谱面少拍。
        # --regress <旧版exe> 在本地做结构性零回归，CI 只需跑全量校验。
        run: |
          python3 tests/check_bar_beats.py --self-test
          python3 tests/check_bar_beats.py

      - name: HTML 附点一致性（35 项自测 + 88 份素材）
        # 文本谱 / MusicXML 的附点必须在 HTML 里也画出来；3 拍 / 6 拍靠
        # 延音线表达不画点。--regress 在本地做结构性零回归，CI 跑全量。
        run: |
          python3 tests/check_html_dots.py --self-test
          python3 tests/check_html_dots.py

      - name: HTML 休止符精确性（72 项自测 + 88 份素材）
        # 文本谱 / MusicXML 已精确拆段，HTML 也必须拆成标准时值之和；
        # 精确档不碎片化、拆不干净保留旧兜底。--regress 在本地做结构回归。
        run: |
          python3 tests/check_html_rests.py --self-test
          python3 tests/check_html_rests.py

      - name: 三端结构一致性（11 项自测 + 88 份素材）
        # 文本谱↔HTML 轨数与逐轨小节数、三端名义拍号、文本谱↔MusicXML
        # 按对齐下标逐轨小节数与逐小节拍号（首/末小节豁免）。比逐音符时值
        # 求和更稳健：和弦并发/多谱表<backup>/三连音编码都会让时值累加失真。
        run: |
          python3 tests/check_three_way.py --self-test
          python3 tests/check_three_way.py

      - name: CLI 端到端冒烟（83 组）
        # 失败项由 tests/ci_report.py 同步写进 annotations 与 step summary。
        run: python3 tests/smoke.py build/midi2jianpu

  wasm:
    name: WASM 产物与导出清单
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 同步守护要 diff 到 push 前的 base commit，浅克隆会拿不到。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: WASM 产物同步（源码变更必须重编）
        # 第 34 组只比版本号：改了 src/ 却不升版本、也不重编 wasm 时会静默
        # 放过；重编了 wasm 却没升版本也一样。这一步纯 git 比对本次变更文件，
        # 双向守护，不编译、不加载 wasm。
        run: |
          python3 tests/check_wasm_sync.py --self-test
          python3 tests/check_wasm_sync.py

      - name: WASM 导出清单一致性
        # 校验 build_wasm.cmd / CMakeLists.txt / wasm_bindings.cpp / 网页 / 冒烟
        # 五处导出符号没有漂移，不编译、不加载 wasm。
        run: python3 tests/check_wasm_exports.py

      - name: WASM 产物冒烟（57 组，含版本号守护）
        run: node tests/wasm_smoke.mjs
