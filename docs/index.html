<!DOCTYPE html>
<html lang="zh">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>midi2jianpu - MIDI转简谱 在线版</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>1</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Serif SC","SimSun",serif;background:#f5f5f0;color:#222;padding:20px}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:24px;border-bottom:3px solid #333;padding-bottom:10px;margin-bottom:16px}
.drop{border:2px dashed #bbb;border-radius:12px;padding:40px 20px;text-align:center;background:#fff;cursor:pointer;transition:background .2s}
.drop:hover,.drop.over{background:#eef;border-color:#66c}
.drop p{color:#888;font-size:14px;margin-top:6px}
.controls{margin:16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.controls label{font-size:14px;color:#555}
.controls select{padding:4px 8px;border:1px solid #ccc;border-radius:4px;font-size:14px}
.controls button{padding:4px 12px;background:#eee;border:1px solid #ccc;border-radius:4px;cursor:pointer;font-size:13px}
.controls button:hover{background:#ddd}
.meta{color:#888;font-size:13px;margin:8px 0;text-align:center}
.score{background:#fff;border:1px solid #ddd;border-radius:8px;padding:20px 32px;margin-top:16px;display:none}
.error{color:#c00;font-size:14px;margin:12px 0;display:none}
.footer{margin-top:24px;color:#999;font-size:12px;text-align:center}
.loading{text-align:center;padding:40px;color:#888}
</style>
</head>
<body>
<div class="wrap">
<h1>MIDI → 简谱 在线转换</h1>
<div class="drop" id="drop">
  <div style="font-size:18px;font-weight:500">拖入 .mid 文件到这里</div>
  <p>或点击选择 · 纯浏览器解析，不上传服务器</p>
</div>
<input type="file" id="file" accept=".mid,.midi" style="display:none">
<div class="controls">
  <label>调性：</label>
  <select id="key">
    <option value="-1:1">自动识别</option>
    <option value="0:1">1=C 大调</option>
    <option value="2:1">1=D 大调</option>
    <option value="4:1">1=E 大调</option>
    <option value="5:1">1=F 大调</option>
    <option value="7:1">1=G 大调</option>
    <option value="9:1">1=A 大调</option>
    <option value="0:0">6=C 小调</option>
    <option value="9:0">6=A 小调</option>
    <option value="4:0" selected>6=E 小调</option>
    <option value="7:0">6=G 小调</option>
  </select>
  <button id="lyricsBtn">上传歌词 (.lrc)</button>
  <input type="file" id="lyricsFile" accept=".lrc,.json" style="display:none">
  <button id="downloadPng" style="display:none">下载 PNG 谱面</button>
</div>
<div class="meta" id="meta"></div>
<div class="score" id="score"></div>
<div class="error" id="err"></div>
<div class="footer">midi2jianpu · 在线 demo · WASM 核心 · C++ 见 GitHub</div>
</div>

<script src="wasm/midi2jianpu.js"></script>
<script>
let wasmMod=null;
let midiBytes=null;
let lyricsText=null;

// 初始化WASM
createMidi2Jianpu().then(mod => {
  wasmMod = mod;
  console.log('WASM模块加载完成');
}).catch(e => {
  document.getElementById('err').textContent = 'WASM加载失败: ' + e.message;
  document.getElementById('err').style.display = 'block';
});

// 上传MIDI文件
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
drop.onclick = () => fileInput.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => {
  e.preventDefault();
  drop.classList.remove('over');
  loadMidi(e.dataTransfer.files[0]);
};
fileInput.onchange = () => loadMidi(fileInput.files[0]);

function loadMidi(f) {
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    midiBytes = new Uint8Array(fr.result);
    convert();
  };
  fr.readAsArrayBuffer(f);
}

// 歌词上传
const lyricsBtn = document.getElementById('lyricsBtn');
const lyricsFile = document.getElementById('lyricsFile');
lyricsBtn.onclick = () => lyricsFile.click();
lyricsFile.onchange = () => {
  const f = lyricsFile.files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    lyricsText = fr.result;
    lyricsBtn.textContent = `歌词已加载`;
    if (midiBytes) convert();
  };
  fr.readAsText(f);
};

// 转换
function convert() {
  if (!wasmMod) {
    document.getElementById('err').textContent = 'WASM模块尚未加载完成，请稍候';
    document.getElementById('err').style.display = 'block';
    return;
  }
  if (!midiBytes) return;

  try {
    const [keyPitch, isMajor] = document.getElementById('key').value.split(':').map(Number);

    // 分配内存
    const ptr = wasmMod._malloc(midiBytes.length);
    wasmMod.HEAPU8.set(midiBytes, ptr);

    // 调用WASM生成HTML
    wasmMod._midi2jianpu_html(ptr, midiBytes.length, keyPitch, isMajor);
    const len = wasmMod._midi2jianpu_result_len();
    const buf = wasmMod._malloc(len + 1);
    wasmMod._midi2jianpu_copy_result(buf, len + 1);
    const html = wasmMod.UTF8ToString(buf);

    // 释放内存
    wasmMod._free(ptr);
    wasmMod._free(buf);

    // 显示结果
    document.getElementById('score').innerHTML = html;
    document.getElementById('score').style.display = 'block';
    document.getElementById('downloadPng').style.display = 'inline-block';
    document.getElementById('err').style.display = 'none';

    // 提取元信息
    const noteMatch = html.match(/(\d+)\s*音符/);
    if (noteMatch) {
      document.getElementById('meta').textContent = `共 ${noteMatch[1]} 音符 · WASM 核心`;
    }
  } catch (e) {
    document.getElementById('err').textContent = '解析失败: ' + e.message;
    document.getElementById('err').style.display = 'block';
  }
}

// 调性选择变化时重新转换
document.getElementById('key').onchange = () => {
  if (midiBytes) convert();
};

// 下载PNG
document.getElementById('downloadPng').onclick = function() {
  const el = document.getElementById('score');
  if (typeof html2canvas === 'undefined') {
    alert('html2canvas未加载');
    return;
  }
  html2canvas(el, { backgroundColor: '#fff', scale: 2 }).then(canvas => {
    const a = document.createElement('a');
    a.download = 'jianpu.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
};
</script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</body>
</html>
