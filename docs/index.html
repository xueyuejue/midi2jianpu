<!DOCTYPE html>
<html lang="zh">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>midi2jianpu - MIDI转简谱 在线版</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>1</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Serif SC","SimSun",serif;background:#f8f8f5;color:#222;padding:20px;min-height:100vh}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:26px;border-bottom:3px solid #b03030;padding-bottom:10px;margin-bottom:16px;color:#b03030;font-weight:700}
.drop{border:2px dashed #ccc;border-radius:12px;padding:40px 20px;text-align:center;background:#fff;cursor:pointer;transition:all .2s}
.drop:hover,.drop.over{background:#fef5f5;border-color:#b03030}
.drop p{color:#999;font-size:14px;margin-top:6px}
.controls{margin:16px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.controls label{font-size:14px;color:#555}
.controls select{padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:14px;background:#fff}
.controls button{padding:6px 14px;background:#fff;border:1px solid #ddd;border-radius:6px;cursor:pointer;font-size:13px;transition:all .2s}
.controls button:hover{background:#f5f5f0;border-color:#bbb}
.meta{color:#888;font-size:13px;margin:8px 0;text-align:center}
.score{background:#fff;border:none;border-radius:0;padding:20px 0;margin-top:16px;display:none}
.error{color:#c00;font-size:14px;margin:12px 0;display:none}
.footer{margin-top:24px;color:#aaa;font-size:12px;text-align:center}
.loading{text-align:center;padding:40px;color:#888}
</style>
</head>
<body>
<div class="wrap">
<h1>MIDI → 简谱 在线转换</h1>
<div class="drop" id="drop">
  <div style="font-size:18px;font-weight:500">拖入 .mid 文件到这里</div>
  <p>或点击选择 · 纯浏览器解析，不上传服务器</p>
</div>
<input type="file" id="file" accept=".mid,.midi" style="display:none">
<div class="controls">
  <label>调性：</label>
  <select id="key">
    <option value="-1:1">自动识别</option>
    <optgroup label="大调">
      <option value="0:1">1=C 大调</option>
      <option value="7:1">1=G 大调</option>
      <option value="2:1">1=D 大调</option>
      <option value="9:1">1=A 大调</option>
      <option value="4:1">1=E 大调</option>
      <option value="11:1">1=B 大调</option>
      <option value="6:1">1=F# 大调</option>
      <option value="1:1">1=C# 大调</option>
      <option value="5:1">1=F 大调</option>
      <option value="10:1">1=Bb 大调</option>
      <option value="3:1">1=Eb 大调</option>
      <option value="8:1">1=Ab 大调</option>
    </optgroup>
    <optgroup label="小调">
      <option value="9:0">6=A 小调</option>
      <option value="4:0" selected>6=E 小调</option>
      <option value="11:0">6=B 小调</option>
      <option value="6:0">6=F# 小调</option>
      <option value="1:0">6=C# 小调</option>
      <option value="8:0">6=G# 小调</option>
      <option value="3:0">6=Eb 小调</option>
      <option value="10:0">6=Bb 小调</option>
      <option value="2:0">6=D 小调</option>
      <option value="7:0">6=G 小调</option>
      <option value="0:0">6=C 小调</option>
      <option value="5:0">6=F 小调</option>
    </optgroup>
  </select>
  <button id="lyricsBtn">上传歌词 (.lrc)</button>
  <input type="file" id="lyricsFile" accept=".lrc,.json" style="display:none">
  <button id="playBtn" style="display:none">播放</button>
  <button id="copyText" style="display:none">复制简谱文本</button>
  <button id="downloadPng" style="display:none">下载 PNG 谱面</button>
</div>
<div class="meta" id="meta"></div>
<div class="score" id="score"></div>
<div class="error" id="err"></div>
<div class="footer">midi2jianpu · 在线 demo · WASM 核心 · C++ 见 GitHub</div>
</div>

<script src="wasm/midi2jianpu.js"></script>
<script>
let wasmMod=null;
let midiBytes=null;
let lyricsText=null;

// 初始化WASM
createMidi2Jianpu().then(mod => {
  wasmMod = mod;
  console.log('WASM模块加载完成');
}).catch(e => {
  document.getElementById('err').textContent = 'WASM加载失败: ' + e.message;
  document.getElementById('err').style.display = 'block';
});

// 上传MIDI文件
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
drop.onclick = () => fileInput.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => {
  e.preventDefault();
  drop.classList.remove('over');
  loadMidi(e.dataTransfer.files[0]);
};
fileInput.onchange = () => loadMidi(fileInput.files[0]);

function loadMidi(f) {
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    midiBytes = new Uint8Array(fr.result);
    convert();
  };
  fr.readAsArrayBuffer(f);
}

// 歌词上传
const lyricsBtn = document.getElementById('lyricsBtn');
const lyricsFile = document.getElementById('lyricsFile');
lyricsBtn.onclick = () => lyricsFile.click();
lyricsFile.onchange = () => {
  const f = lyricsFile.files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    lyricsText = fr.result;
    lyricsBtn.textContent = `歌词已加载`;
    if (midiBytes) convert();
  };
  fr.readAsText(f);
};

// 转换
function convert() {
  if (!wasmMod) {
    document.getElementById('err').textContent = 'WASM模块尚未加载完成，请稍候';
    document.getElementById('err').style.display = 'block';
    return;
  }
  if (!midiBytes) return;

  try {
    const [keyPitch, isMajor] = document.getElementById('key').value.split(':').map(Number);

    // 分配内存
    const ptr = wasmMod._malloc(midiBytes.length);
    wasmMod.HEAPU8.set(midiBytes, ptr);

    // 调用WASM生成HTML
    // 先设置歌词
    if (lyricsText && wasmMod._midi2jianpu_set_lyrics) {
      const lrcLen = wasmMod.lengthBytesUTF8(lyricsText) + 1;
      const lrcPtr = wasmMod._malloc(lrcLen);
      wasmMod.stringToUTF8(lyricsText, lrcPtr, lrcLen);
      wasmMod._midi2jianpu_set_lyrics(lrcPtr);
      wasmMod._free(lrcPtr);
    }
    wasmMod._midi2jianpu_html(ptr, midiBytes.length, keyPitch, isMajor);
    const len = wasmMod._midi2jianpu_result_len();
    const buf = wasmMod._malloc(len + 1);
    wasmMod._midi2jianpu_copy_result(buf, len + 1);
    const html = wasmMod.UTF8ToString(buf);

    // 释放内存
    wasmMod._free(ptr);
    wasmMod._free(buf);

    // 显示结果
    document.getElementById('score').innerHTML = html;
    document.getElementById('score').style.display = 'block';
    document.getElementById('downloadPng').style.display = 'inline-block';
    document.getElementById('copyText').style.display = 'inline-block';
    document.getElementById('playBtn').style.display = 'inline-block';
    document.getElementById('err').style.display = 'none';

    // 提取元信息
    const noteMatch = html.match(/(\d+)\s*音符/);
    if (noteMatch) {
      document.getElementById('meta').textContent = `共 ${noteMatch[1]} 音符 · WASM 核心`;
    }
  } catch (e) {
    document.getElementById('err').textContent = '解析失败: ' + e.message;
    document.getElementById('err').style.display = 'block';
  }
}

// 调性选择变化时重新转换
document.getElementById('key').onchange = () => {
  if (midiBytes) convert();
};

// 下载PNG
document.getElementById('downloadPng').onclick = function() {
  const el = document.getElementById('score');
  if (typeof html2canvas === 'undefined') {
    alert('html2canvas未加载');
    return;
  }
  html2canvas(el, { backgroundColor: '#fff', scale: 2 }).then(canvas => {
    const a = document.createElement('a');
    a.download = 'jianpu.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
};

// 复制简谱文本
document.getElementById('copyText').onclick = function() {
  const el = document.getElementById('score');
  // 从HTML中提取文本简谱
  const measures = el.querySelectorAll('.measure');
  let text = '';
  // 提取标题和元信息
  const h1 = el.querySelector('h1');
  const meta = el.querySelector('.meta');
  if (h1) text += h1.textContent + '\n';
  if (meta) text += meta.textContent + '\n';
  text += '-'.repeat(40) + '\n';
  // 提取每个小节的音符
  measures.forEach(m => {
    let line = '';
    const notes = m.querySelectorAll('.note');
    notes.forEach(n => {
      const num = n.querySelector('.num');
      const lyric = n.querySelector('.lyric');
      if (num) {
        let s = num.textContent;
        // 检查高音点/低音点
        if (n.classList.contains('dot-above')) s += "'";
        if (n.classList.contains('dot-below')) s += ',';
        line += s + ' ';
      }
      const exts = n.querySelectorAll('.ext');
      exts.forEach(e => { line += e.textContent + ' '; });
    });
    const exts = m.querySelectorAll('.ext');
    exts.forEach(e => { line += e.textContent + ' '; });
    if (line.trim()) text += line.trim() + '  |\n';
  });
  // 复制到剪贴板
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyText');
    const old = btn.textContent;
    btn.textContent = '已复制!';
    setTimeout(() => btn.textContent = old, 1500);
  }).catch(() => {
    alert('复制失败，请手动选择文本复制');
  });
};

// 播放功能
let audioCtx = null;
let isPlaying = false;
let playTimeout = null;

document.getElementById('playBtn').onclick = function() {
  if (!wasmMod || !midiBytes) return;
  if (isPlaying) {
    stopPlayback();
    return;
  }
  startPlayback();
};

function startPlayback() {
  try {
    // 从WASM获取音符JSON
    const ptr = wasmMod._malloc(midiBytes.length);
    wasmMod.HEAPU8.set(midiBytes, ptr);
    wasmMod._midi2jianpu_get_notes_json(ptr, midiBytes.length);
    const len = wasmMod._midi2jianpu_result_len();
    const buf = wasmMod._malloc(len + 1);
    wasmMod._midi2jianpu_copy_result(buf, len + 1);
    const jsonStr = wasmMod.UTF8ToString(buf);
    wasmMod._free(ptr);
    wasmMod._free(buf);

    const notes = JSON.parse(jsonStr);
    if (notes.length === 0) return;

    // 创建AudioContext
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const now = audioCtx.currentTime;
    let maxEnd = 0;

    // 播放每个音符
    notes.forEach(note => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      // MIDI音高转频率: 440 * 2^((pitch-69)/12)
      const freq = 440 * Math.pow(2, (note.pitch - 69) / 12);
      osc.frequency.value = freq;
      osc.type = 'triangle';
      // 包络: 快速起音, 缓慢衰减
      const start = now + note.time;
      const dur = Math.max(note.duration, 0.1);
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.3, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.01, start + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + dur);
      maxEnd = Math.max(maxEnd, start + dur);
    });

    isPlaying = true;
    const btn = document.getElementById('playBtn');
    btn.textContent = '停止';
    // 播放结束后恢复按钮
    playTimeout = setTimeout(() => {
      stopPlayback();
    }, (maxEnd - now) * 1000 + 500);
  } catch (e) {
    alert('播放失败: ' + e.message);
  }
}

function stopPlayback() {
  isPlaying = false;
  if (playTimeout) {
    clearTimeout(playTimeout);
    playTimeout = null;
  }
  // 停止所有正在播放的音符
  if (audioCtx) {
    audioCtx.close();
    audioCtx = null;
  }
  const btn = document.getElementById('playBtn');
  btn.textContent = '播放';
}
</script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</body>
</html>
